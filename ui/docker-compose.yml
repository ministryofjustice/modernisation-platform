services:
  ui:
    build: .
    image: modernisation-platform-ui:dev
    container_name: modernisation-platform-ui
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      SESSION_SECRET: "change-me-in-real-deployments"
      ENVIRONMENT_REQUEST_MODE: "${ENVIRONMENT_REQUEST_MODE:-preview}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_WORKFLOW_REF: "${GITHUB_WORKFLOW_REF:-main}"
    restart: unless-stopped
