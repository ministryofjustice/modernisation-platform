---
name: Reusable - Load Balancer and WAF Logging Discovery

"on":
  workflow_call:
    inputs:
      environment_management:
        required: true
        type: string
      account_name:
        required: true
        type: string
      regions:
        required: true
        type: string
    secrets:
      PASSPHRASE:
        required: true

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash

jobs:
  discover:
    name: Discover (${{ inputs.account_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decrypt account data
        uses: ministryofjustice/modernisation-platform-github-actions/decrypt-secrets@ebec2f2fda2f93172de61774b5875b9cef7462bc # v6.2.12
        with:
          environment_management: ${{ inputs.environment_management }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}

      - name: Resolve member account ID
        id: account
        env:
          ACCOUNT_NAME: ${{ inputs.account_name }}
        run: |
          set -euo pipefail
          if [[ -z "${ENVIRONMENT_MANAGEMENT:-}" ]]; then
            echo "ENVIRONMENT_MANAGEMENT not set after decrypt-secrets" >&2
            exit 1
          fi
          account_id="$(jq -er --arg name "$ACCOUNT_NAME" '.account_ids[$name]' <<< "$ENVIRONMENT_MANAGEMENT")"
          echo "::add-mask::$account_id"
          echo "account-id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ steps.account.outputs.account-id }}:role/github-actions-resource-discovery
          role-session-name: load-balancer-discovery
          aws-region: eu-west-2
          role-skip-session-tagging: true

      - name: Discover load balancer and WAF logging
        env:
          ACCOUNT_NAME: ${{ inputs.account_name }}
          REGIONS: ${{ inputs.regions }}
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: "10"
        run: |
          set -euo pipefail
          mkdir -p account-results
          bash scripts/internal/load-balancer-discovery/discover.sh "$ACCOUNT_NAME" "$REGIONS" \
            > "account-results/${ACCOUNT_NAME}.json"
          jq -e '.load_balancers | type == "array"' "account-results/${ACCOUNT_NAME}.json" > /dev/null

      - name: Upload account results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lb-waf-discovery-${{ inputs.account_name }}
          path: account-results/
          if-no-files-found: error
          retention-days: 14
