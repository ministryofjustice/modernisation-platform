name: Environment Request

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      request_json:
        description: Structured JSON request from the self-service UI
        required: true
        type: string

permissions: read-all

jobs:
  handle-request:
    env:
      EXISTING_ACCOUNT: ""
      PR_BODY: ""
      PR_BODY_FILE: ""
      PR_TITLE: ""
      changes: "false"
    permissions:
      contents: write
      issues: write 
      pull-requests: write
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'New Account')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Save issue body to file
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "$ISSUE_BODY" > issue_body.txt
          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> "$GITHUB_ENV"

      - name: Extract fields from issue
        if: github.event_name == 'issues'
        run: |
          # Function to extract and sanitize field values
          extract_field() {
            local key="$1"
            local value
            value=$(awk -v k="$key" '$0==k {while(getline>0){if($0~/^$/)continue;if($0~/^_No response_$/){print "";exit}print $0;exit}}' issue_body.txt | xargs)
            # Sanitize: remove newlines/carriage returns, limit to 200 chars
            echo "$value" | tr -d '\n\r' | head -c 200
          }
          
          # Extract all fields
          EXISTING_ACCOUNT=$(extract_field "### Is this an existing AWS account?")
          APP_NAME=$(extract_field "### Application Name")
          APP_TAG=$(extract_field "### application")
          BUSINESS_UNIT=$(extract_field "### business-unit")
          SERVICE_AREA=$(extract_field "### service-area")
          INFRA_SUPPORT=$(extract_field "### infrastructure-support")
          OWNER=$(extract_field "### owner")
          SSO_GROUP=$(extract_field "### SSO Group Name")
          ISOLATED_ACCOUNT=$(extract_field "### Do you require isolated networking?")
          SLACK=$(extract_field "### Slack Channel")
          GITHUB_OWNERS=$(extract_field "### GitHub code owner team slug")
          GITHUB_REVIEWERS=$(extract_field "### GitHub actions reviewer team slug")
          
          
          # Write to GITHUB_ENV
          {
            echo "EXISTING_ACCOUNT=$EXISTING_ACCOUNT"
            echo "APP_NAME=$APP_NAME"
            echo "APP_TAG=$APP_TAG"
            echo "BUSINESS_UNIT=$BUSINESS_UNIT"
            echo "SERVICE_AREA=$SERVICE_AREA"
            echo "INFRA_SUPPORT=$INFRA_SUPPORT"
            echo "OWNER=$OWNER"
            echo "SSO_GROUP=$SSO_GROUP"
            echo "ISOLATED_ACCOUNT=$ISOLATED_ACCOUNT"
            echo "SLACK=$SLACK"
            echo "GITHUB_OWNERS=$GITHUB_OWNERS"
            echo "GITHUB_REVIEWERS=$GITHUB_REVIEWERS"
          } >> "$GITHUB_ENV"

      - name: Validate Slack field (no #)
        if: github.event_name == 'issues'
        run: |
          if [[ "${SLACK}" == *"#"* ]]; then
            echo "::error title=Invalid Slack Channel::SLACK must not include '#'. Please enter the channel name without the leading hash (e.g. 'my-channel' not '#my-channel'). Value: '${SLACK}'"
            exit 1
          fi

      - name: Validate issue request metadata
        if: github.event_name == 'issues'
        run: |
          if [[ ! "$APP_NAME" =~ ^[a-z0-9-]{1,30}$ ]]; then
            echo "::error title=Invalid application name::Application name must contain only lowercase letters, numbers and hyphens, with a maximum of 30 characters."
            exit 1
          fi

          if [[ "$EXISTING_ACCOUNT" != "Yes" && "$EXISTING_ACCOUNT" != "No" ]]; then
            echo "::error title=Invalid account type::Existing account must be Yes or No."
            exit 1
          fi

          if [[ "$ISOLATED_ACCOUNT" != "Yes" && "$ISOLATED_ACCOUNT" != "No" ]]; then
            echo "::error title=Invalid networking choice::Isolated networking must be Yes or No."
            exit 1
          fi

      - name: Extract environment selections
        if: github.event_name == 'issues'
        run: |
          extract_access() {
            local key="$1"
            awk -v key="$key" '
              $0==key {found=1; next}
              found && /^### / {exit}
              found && NF && $0!="_No response_" {print $0}
            ' issue_body.txt | paste -sd, -
          }

          add_environment() {
            local name="$1"
            local access_level="$2"
            ENV_SELECTIONS_JSON=$(jq -c \
              --arg name "$name" \
              --arg access_level "$access_level" \
              '. + [{name: $name, access_level: $access_level}]' \
              <<< "$ENV_SELECTIONS_JSON")
          }

          ENV_SELECTIONS_JSON='[]'

          # Development
          if grep -Fq -- '- [x] Development' issue_body.txt; then
            add_environment "development" "$(extract_access '### Environment access level Development')"
          fi

          # Test
          if grep -Eq -- '- \[x\] (Test|test)' issue_body.txt; then
            add_environment "test" "$(extract_access '### Environment access level Test')"
          fi

          # Preproduction
          if grep -Fq -- '- [x] Preproduction' issue_body.txt; then
            add_environment "preproduction" "$(extract_access '### Environment access level Preproduction')"
          fi

          # Production
          if grep -Fq -- '- [x] Production' issue_body.txt; then
            add_environment "production" "$(extract_access '### Environment access level Production')"
          fi

          echo "ENV_SELECTIONS_JSON=$ENV_SELECTIONS_JSON" >> "$GITHUB_ENV"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate files from self-service request
        id: self_service_request
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          printf '%s' "$REQUEST_JSON" > request.json
          python scripts/create-account.py --request request.json

          {
            echo "APP_NAME=$(jq -r '.application.name' request.json)"
            echo "BUSINESS_UNIT=$(jq -r '.tags.businessUnit' request.json)"
            echo "EXISTING_ACCOUNT=No"
            echo "ISOLATED_ACCOUNT=$(jq -r 'if .networking.isolated then "Yes" else "No" end' request.json)"
            echo "REQUEST_ID=$(jq -r '.requestId' request.json)"
          } >> "$GITHUB_ENV"

      - name: Run create-account.py for new accounts
        if: github.event_name == 'issues' && env.EXISTING_ACCOUNT == 'No'
        run: |
          python scripts/create-account.py "$APP_NAME" "$APP_TAG" "$GITHUB_OWNERS" "$GITHUB_REVIEWERS" "$BUSINESS_UNIT" "$SERVICE_AREA" "$INFRA_SUPPORT" "$OWNER" "$SLACK" "false" "$SSO_GROUP" "" "$ENV_SELECTIONS_JSON"

      - name: Run amend-accounts.py for existing accounts
        if: github.event_name == 'issues' && env.EXISTING_ACCOUNT == 'Yes'
        run: |
          python scripts/amend-accounts.py \
            "$APP_NAME" \
            "$SSO_GROUP" \
            "$ENV_SELECTIONS_JSON"

      - name: Set pull request metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EXISTING_ACCOUNT" = "Yes" ]; then
            echo "PR_TITLE=Automated environment amendment request for $APP_NAME" >> "$GITHUB_ENV"
          else
            echo "PR_TITLE=Automated environment request for $APP_NAME" >> "$GITHUB_ENV"
          fi

          if [ "$EVENT_NAME" = "issues" ]; then
            REQUEST_SOURCE="Linked to #$ISSUE_NUMBER"
          else
            REQUEST_SOURCE="Self-service request $REQUEST_ID"
          fi
          echo "PR_BODY=This PR was created automatically to update generated files. $REQUEST_SOURCE. <!-- isolated-networking: $ISOLATED_ACCOUNT -->" >> "$GITHUB_ENV"

      - name: Prepare self-service request summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          PR_BODY_FILE="$RUNNER_TEMP/environment-request.md"
          {
            printf 'This PR was created automatically from self-service request %s.\n' "$REQUEST_ID"
            echo
            echo '<details>'
            echo '<summary>Submitted request</summary>'
            echo
            echo '<pre>'
            jq '.' request.json | jq -Rrs '@html'
            echo '</pre>'
            echo '</details>'
            echo
            echo "<!-- isolated-networking: $ISOLATED_ACCOUNT -->"
          } > "$PR_BODY_FILE"
          echo "PR_BODY_FILE=$PR_BODY_FILE" >> "$GITHUB_ENV"

      - name: Remove temporary request files
        run: rm -f issue_body.txt request.json

      - name: Create signed commit and pull request
        uses: ministryofjustice/modernisation-platform-github-actions/signed-commit@2988728879704953e739f82ac926d37931c6d01b # v6.1.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: ${{ env.PR_TITLE }}
          pr_body: ${{ env.PR_BODY }}

      - name: Find created pull request
        id: pull_request
        if: env.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh pr view "$branch_name" --json number,url)
          echo "number=$(jq -r '.number' <<< "$PR_JSON")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.url' <<< "$PR_JSON")" >> "$GITHUB_OUTPUT"

      - name: Add self-service request to pull request
        if: github.event_name == 'workflow_dispatch' && env.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "${{ steps.pull_request.outputs.url }}" --body-file "$PR_BODY_FILE"

      - name: Comment on issue with PR link
        if: github.event_name == 'issues' && env.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "A pull request has been created for your environment request: ${{ steps.pull_request.outputs.url }}"
