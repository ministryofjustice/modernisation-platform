---
name: Generate Terraform README docs
"on":
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/modules/**/*.md'
      - '.github/workflows/documentation.yml'

permissions: read-all

env:
  APP_ID: 2013696

jobs:
  docs:
    permissions: {}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        persist-credentials: false

    - name: Render terraform docs and push changes back to PR
      uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
      with:
        find-dir: terraform/modules
        output-file: README.md
        output-method: inject
        git-push: "false"

    - name: Fix Git permissions
      run: sudo chown -R "$(whoami)" .git/

    - name: Create GitHub App token
      id: app
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ env.APP_ID }}
        private-key: ${{ secrets.MP_GITHUB_APP_PRIVATE_KEY }}
        repositories: modernisation-platform
        permission-contents: write
        permission-pull-requests: write

    - name: Run Signed Commit Action
      uses: ministryofjustice/modernisation-platform-github-actions/signed-commit@5ec14e836f3de882a84f1c0b919645846a9d4f8e # v6.2.13
      with:
        github_token: ${{ steps.app.outputs.token }}
