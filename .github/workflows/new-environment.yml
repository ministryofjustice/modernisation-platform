  modernisation-platform-account-plan-and-apply:
    uses: ./.github/workflows/reusable_terraform_plan_apply.yml
    needs: create-environment
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    with:
      working-directory: "terraform/modernisation-platform-account"
      workflow_id: "modernisation-platform-account"
      set_github_app_token: true
      download_collaborators: true
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_NUMBER: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_NUMBER }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  core-shared-services-deployment:
    needs:
      - member-bootstrap
      - modernisation-platform-account-plan-and-apply
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/reusable_terraform_plan_apply.yml
    with:
      working-directory: "terraform/environments/core-shared-services"
      environment: "production"
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_NUMBER: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_NUMBER }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

