name: Account Network Update

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  issues: read
  pull-requests: write


jobs:
  network-setup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check whether this PR carries a network-setup request
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The create-newenv workflow commits network-setup-info.json into the
          # PR it opens. We only act if THIS PR touched that file, so unrelated
          # merges are skipped and a lingering file in main cannot re-trigger.
          if ! gh pr view "$PR_NUMBER" --repo "$REPO" --json files \
                --jq '.files[].path' | grep -Fxq 'network-setup-info.json'; then
            echo "PR #$PR_NUMBER did not modify network-setup-info.json. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f network-setup-info.json ]; then
            echo "::error::network-setup-info.json missing from merged tree."
            exit 1
          fi
          # Validate JSON shape early and export the fields we need.
          jq -e '
            (.isolated_account | type == "string")
            and (.app_name      | type == "string")
            and (.business_unit | type == "string")
            and (.environments  | type == "array")
          ' network-setup-info.json >/dev/null

          ISOLATED_ACCOUNT="$(jq -r '.isolated_account' network-setup-info.json | tr -d '\r\n')"
          APP_NAME="$(jq -r '.app_name' network-setup-info.json | tr -d '\r\n')"
          BUSINESS_UNIT="$(jq -r '.business_unit' network-setup-info.json | tr -d '\r\n')"

          if ! [[ "$ISOLATED_ACCOUNT" =~ ^(Yes|No)$ ]]; then
            echo "::error::network-setup-info.json has invalid isolated_account (expected 'Yes' or 'No'): $ISOLATED_ACCOUNT"
            exit 1
          fi
          if ! [[ "$APP_NAME" =~ ^[A-Za-z0-9._-]{1,100}$ ]]; then
            echo "::error::network-setup-info.json has invalid app_name: $APP_NAME"
            exit 1
          fi
          if ! [[ "$BUSINESS_UNIT" =~ ^[A-Za-z0-9._-]{1,100}$ ]]; then
            echo "::error::network-setup-info.json has invalid business_unit: $BUSINESS_UNIT"
            exit 1
          fi
          if ! jq -e '.environments | all(. == "development" or . == "test" or . == "preproduction" or . == "production")' network-setup-info.json >/dev/null; then
            echo "::error::network-setup-info.json has invalid environments list (expected: development/test/preproduction/production)"
            exit 1
          fi

          {
            printf 'ISOLATED_ACCOUNT=%s\n' "$ISOLATED_ACCOUNT"
            printf 'APP_NAME=%s\n'         "$APP_NAME"
          } >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Run network-setup.py
        if: steps.check.outputs.skip != 'true' && env.ISOLATED_ACCOUNT == 'No'
        run: |
          set -euo pipefail
          mapfile -t args < <(jq -r '[.app_name, .business_unit] + .environments | .[]' network-setup-info.json)
          python scripts/network-setup.py "${args[@]}"

      - name: Commit and push network changes

        if: steps.check.outputs.skip != 'true' && env.ISOLATED_ACCOUNT == 'No'
        uses: ministryofjustice/modernisation-platform-github-actions/signed-commit@40972648982915f26e5b5e22bd92f3af9297a707 # v6.1.7

        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: "Automated Signed Commit"
          pr_body: "This PR was created automatically to update generated files."
          commit_message: "Automated environment request for ${{ env.APP_NAME }}"
          files_to_commit: |
            environments-networks/*
            policies/networks/*
