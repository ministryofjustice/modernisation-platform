name: Account Network Update

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write


jobs:
  network-setup:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.body, '<!-- isolated-networking: No -->')
    env:
      SKIP: "false"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find newly added environment files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --paginate \
            --jq '.[] | select(.status == "added") | .filename | select(startswith("environments/") and endswith(".json"))')

          if [ -z "$files" ]; then
            echo "No new environment files found. Skipping network setup."
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            printf '%s\n' "$files" > new-environment-files.txt
          fi

      - name: Set up Python
        if: env.SKIP != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Run network-setup.py
        if: env.SKIP != 'true'
        run: |
          while IFS= read -r environment_file; do
            app_name=$(basename "$environment_file" .json)
            business_unit=$(jq -er '.tags["business-unit"]' "$environment_file")
            mapfile -t environments < <(jq -er '.environments[].name' "$environment_file")

            python scripts/network-setup.py \
              "$app_name" \
              "$business_unit" \
              "${environments[@]}"
          done < new-environment-files.txt

          rm new-environment-files.txt

      - name: Create pull request for network changes
        if: env.SKIP != 'true'
        uses: ministryofjustice/modernisation-platform-github-actions/signed-commit@2988728879704953e739f82ac926d37931c6d01b # v6.1.9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: "Automated networking for new environments"
          pr_body: "This PR was created automatically after a new environment request was merged."
