---
name: Mirror PDC Agent

on:
  workflow_dispatch:
    inputs:
      version:
        description: "grafana/pdc-agent version, for example 0.0.67"
        required: true
        type: string
      digest:
        description: "Expected image index digest from Docker Hub (sha256:...)"
        required: true
        type: string

permissions: {}

jobs:
  mirror:
    name: Mirror PDC Agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_IMAGE: docker.io/grafana/pdc-agent
      TARGET_IMAGE: 374269020027.dkr.ecr.eu-west-2.amazonaws.com/observability-platform-pdc-agent
      VERSION: ${{ inputs.version }}
      DIGEST: ${{ inputs.digest }}
    steps:
      - name: Validate inputs
        id: validate_inputs
        shell: bash
        run: |
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: ${VERSION}"; exit 1; }
          [[ "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid digest: ${DIGEST}"; exit 1; }

      - name: Install cosign
        id: install_cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Configure AWS Credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-west-2
          role-to-assume: arn:aws:iam::915524366300:role/modernisation-platform-oidc-cicd

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: 374269020027

      - name: Verify upstream digest
        id: verify_upstream_digest
        shell: bash
        run: |
          actual=$(docker buildx imagetools inspect "${SOURCE_IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ "${actual}" != "${DIGEST}" ]]; then
            echo "Digest mismatch for ${SOURCE_IMAGE}:${VERSION}: expected ${DIGEST}, got ${actual}"
            exit 1
          fi

      - name: Mirror
        id: mirror
        shell: bash
        run: |
          docker buildx imagetools create --tag "${TARGET_IMAGE}:${VERSION}" "${SOURCE_IMAGE}@${DIGEST}"

      - name: Sign
        id: sign
        shell: bash
        run: |
          cosign sign --yes "${TARGET_IMAGE}@${DIGEST}"

      - name: Verify
        id: verify
        shell: bash
        run: |
          cosign verify \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity="https://github.com/ministryofjustice/observability-platform-grafana-api-key-rotator/.github/workflows/mirror-pdc-agent.yml@${GITHUB_REF}" \
            "${TARGET_IMAGE}@${DIGEST}"
