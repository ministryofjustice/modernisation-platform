---
name: Load Balancer and WAF Logging Discovery

"on":
  workflow_dispatch:
    inputs:
      accounts:
        description: "Comma-separated application or account names, or all"
        required: true
        type: string
      business_unit:
        description: "Business unit filter applied to the account selection"
        required: true
        type: choice
        default: all
        options:
          - all
          - CICA
          - CJSE
          - HMPPS
          - HMCTS
          - HQ
          - LAA
          - OPG
          - Platforms
          - Property
          - YJB
      regions:
        description: "Comma-separated ALB/NLB and regional WAF regions; CloudFront WAF is always included"
        required: true
        type: string
        default: "eu-central-1,eu-west-1,eu-west-2,eu-west-3,us-east-1"

permissions: {}

concurrency:
  group: load-balancer-discovery
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  fetch-secrets:
    uses: ministryofjustice/modernisation-platform-github-actions/.github/workflows/aws-secrets-management.yml@ebec2f2fda2f93172de61774b5875b9cef7462bc # v6.2.12
    permissions:
      id-token: write
      contents: read
    secrets:
      MODERNISATION_PLATFORM_ACCOUNT_NUMBER: ${{ secrets.MODERNISATION_PLATFORM_ACCOUNT_NUMBER }}
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  select-accounts:
    name: Select accounts
    runs-on: ubuntu-latest
    needs: fetch-secrets
    permissions:
      contents: read
    outputs:
      block_1: ${{ steps.select.outputs.block_1 }}
      block_2: ${{ steps.select.outputs.block_2 }}
      block_3: ${{ steps.select.outputs.block_3 }}
      block_4: ${{ steps.select.outputs.block_4 }}
      selected_count: ${{ steps.select.outputs.selected_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decrypt account data
        uses: ministryofjustice/modernisation-platform-github-actions/decrypt-secrets@ebec2f2fda2f93172de61774b5875b9cef7462bc # v6.2.12
        with:
          environment_management: ${{ needs.fetch-secrets.outputs.environment_management }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}

      - name: Build account matrices
        id: select
        env:
          BUSINESS_UNIT: ${{ inputs.business_unit }}
          REQUESTED_ACCOUNTS: ${{ inputs.accounts }}
        run: |
          set -euo pipefail
          if [[ -z "${ENVIRONMENT_MANAGEMENT:-}" ]]; then
            echo "ENVIRONMENT_MANAGEMENT not set after decrypt-secrets" >&2
            exit 1
          fi
          catalog="$(
            jq -nc '[
              inputs
              | select(."account-type" == "member" or ."account-type" == "member-unrestricted")
              | . as $definition
              | (input_filename | split("/") | last | rtrimstr(".json")) as $application
              | $definition.environments[]
              | {
                  application: $application,
                  name: ($application + "-" + .name),
                  business_unit: $definition.tags["business-unit"]
                }
            ] | sort_by(.name)' environments/*.json
          )"
          account_ids="$(jq -c '.account_ids' <<< "$ENVIRONMENT_MANAGEMENT")"
          catalog="$(jq -nc --argjson catalog "$catalog" --argjson ids "$account_ids" \
            '$catalog | map(. as $account | select($ids[$account.name] != null))')"
          scope="$(jq -nr --arg value "$REQUESTED_ACCOUNTS" '$value | gsub("^\\s+|\\s+$"; "") | ascii_downcase')"
          if [[ "$scope" == "all" ]]; then
            selected="$catalog"
          else
            requested="$(jq -nc --arg value "$REQUESTED_ACCOUNTS" \
              '$value | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)) | unique')"
            if [[ "$(jq length <<< "$requested")" -eq 0 ]]; then
              echo "At least one application or account name, or all, is required" >&2
              exit 1
            fi
            unknown="$(jq -nc --argjson requested "$requested" --argjson catalog "$catalog" '
              [$requested[] | select(. as $value | any($catalog[]; .name == $value or .application == $value) | not)]
            ')"
            if [[ "$(jq length <<< "$unknown")" -gt 0 ]]; then
              echo "Unknown or ineligible applications/accounts: $(jq -r 'join(", ")' <<< "$unknown")" >&2
              exit 1
            fi
            selected="$(jq -nc --argjson requested "$requested" --argjson catalog "$catalog" '
              [$catalog[] | select(. as $account | $requested | any(. == $account.name or . == $account.application))]
            ')"
          fi
          if [[ "$BUSINESS_UNIT" != "all" ]]; then
            selected="$(jq -c --arg unit "$BUSINESS_UNIT" 'map(select(.business_unit == $unit))' <<< "$selected")"
          fi
          names="$(jq -c '[.[].name] | sort' <<< "$selected")"
          total="$(jq length <<< "$names")"
          if (( total == 0 )); then
            echo "The supplied filters selected no accounts" >&2
            exit 1
          fi
          if (( total > 1024 )); then
            echo "Selection exceeds the four 256-job matrix blocks; narrow the account filters" >&2
            exit 1
          fi
          start=0
          for block in 1 2 3 4; do
            extra=0
            if (( block <= total % 4 )); then extra=1; fi
            end=$((start + total / 4 + extra))
            echo "block_${block}=$(jq -c ".[$start:$end]" <<< "$names")" >> "$GITHUB_OUTPUT"
            start=$end
          done
          echo "selected_count=$total" >> "$GITHUB_OUTPUT"
          {
            echo "## Load balancer and WAF logging discovery selection"
            echo
            echo "Selected **$total** member account(s)."
            jq -r '.[] | "- `\(.)`"' <<< "$names"
          } >> "$GITHUB_STEP_SUMMARY"

  discover-1:
    name: Discovery block 1
    needs: [fetch-secrets, select-accounts]
    if: ${{ needs.select-accounts.outputs.block_1 != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        account_name: ${{ fromJSON(needs.select-accounts.outputs.block_1) }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-load-balancer-discovery.yml
    with:
      environment_management: ${{ needs.fetch-secrets.outputs.environment_management }}
      account_name: ${{ matrix.account_name }}
      regions: ${{ inputs.regions }}
    secrets:
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  discover-2:
    name: Discovery block 2
    needs: [fetch-secrets, select-accounts]
    if: ${{ needs.select-accounts.outputs.block_2 != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        account_name: ${{ fromJSON(needs.select-accounts.outputs.block_2) }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-load-balancer-discovery.yml
    with:
      environment_management: ${{ needs.fetch-secrets.outputs.environment_management }}
      account_name: ${{ matrix.account_name }}
      regions: ${{ inputs.regions }}
    secrets:
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  discover-3:
    name: Discovery block 3
    needs: [fetch-secrets, select-accounts]
    if: ${{ needs.select-accounts.outputs.block_3 != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        account_name: ${{ fromJSON(needs.select-accounts.outputs.block_3) }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-load-balancer-discovery.yml
    with:
      environment_management: ${{ needs.fetch-secrets.outputs.environment_management }}
      account_name: ${{ matrix.account_name }}
      regions: ${{ inputs.regions }}
    secrets:
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  discover-4:
    name: Discovery block 4
    needs: [fetch-secrets, select-accounts]
    if: ${{ needs.select-accounts.outputs.block_4 != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        account_name: ${{ fromJSON(needs.select-accounts.outputs.block_4) }}
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-load-balancer-discovery.yml
    with:
      environment_management: ${{ needs.fetch-secrets.outputs.environment_management }}
      account_name: ${{ matrix.account_name }}
      regions: ${{ inputs.regions }}
    secrets:
      PASSPHRASE: ${{ secrets.PASSPHRASE }}

  aggregate-results:
    name: Aggregate results
    runs-on: ubuntu-latest
    needs: [select-accounts, discover-1, discover-2, discover-3, discover-4]
    if: ${{ always() && needs.select-accounts.result == 'success' }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download account results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: lb-waf-discovery-*
          path: account-results
          merge-multiple: true

      - name: Build combined JSON and CSV
        env:
          SELECTED_COUNT: ${{ needs.select-accounts.outputs.selected_count }}
        run: |
          set -euo pipefail
          mkdir -p account-results combined-results
          find account-results -type f -name '*.json' -exec jq -c . {} + > account-results.jsonl
          jq -s '{
            accounts: (map({account_name, account_id, regions}) | unique_by(.account_name) | sort_by(.account_name)),
            load_balancers: ([.[].load_balancers[]] | unique_by(.arn) | sort_by(.account_name, .region, .name)),
            web_acls: ([.[].web_acls[]] | unique_by(.arn) | sort_by(.account_name, .scope, .region, .name))
          }' account-results.jsonl > combined-results/logging-discovery.json
          jq --argjson selected "$SELECTED_COUNT" \
            '. + {selected_account_count: $selected, completed_account_count: (.accounts | length),
              complete: ((.accounts | length) == $selected)}' \
            combined-results/logging-discovery.json > combined-results/report.json
          mv combined-results/report.json combined-results/logging-discovery.json
          jq -r '
            ["account_name","account_id","region","name","arn","type","scheme","dns_name","access_logging_enabled",
              "s3_bucket","s3_prefix","access_log_uri","waf_web_acl_arns"],
            (.load_balancers[] | [.account_name,.account_id,.region,.name,.arn,.type,.scheme,.dns_name,
              .access_logging_enabled,.s3_bucket,.s3_prefix,.access_log_uri,(.waf_web_acl_arns | join(";"))])
            | @csv
          ' combined-results/logging-discovery.json > combined-results/load-balancers.csv
          jq -r '
            ["account_name","account_id","region","scope","name","arn","logging_enabled","logging_destinations",
              "logging_configurations","alb_arns"],
            (.web_acls[] | [.account_name,.account_id,.region,.scope,.name,.arn,.logging_enabled,
              (.logging_destinations | join(";")),(.logging_configurations | tojson),(.alb_arns | join(";"))])
            | @csv
          ' combined-results/logging-discovery.json > combined-results/web-acls.csv
          {
            echo "## Combined load balancer and WAF logging discovery"
            echo
            jq -r '
              "- Selected accounts: **\(.selected_account_count)**",
              "- Accounts completed (including empty results): **\(.completed_account_count)**",
              "- Complete account coverage: **\(.complete)**",
              "- ALBs/NLBs: **\(.load_balancers | length)**",
              "- ALBs/NLBs with access logging enabled: **\([.load_balancers[] | select(.access_logging_enabled)] | length)**",
              "- WAF web ACLs: **\(.web_acls | length)**",
              "- WAF web ACLs with logging enabled: **\([.web_acls[] | select(.logging_enabled)] | length)**"
            ' combined-results/logging-discovery.json
            echo
            echo "A failed run is incomplete; downloaded reports contain only successful accounts."
            echo "Logging enabled does not confirm log delivery, retention, or CVE exposure."
            echo "NLB access logs cover TLS listeners only and do not contain HTTP request URLs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined results
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lb-waf-discovery-results
          path: combined-results/
          if-no-files-found: error
          retention-days: 14

      - name: Add download link
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "[Download combined JSON and CSV reports]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail for incomplete discovery
        env:
          BLOCK_1: ${{ needs.discover-1.result }}
          BLOCK_2: ${{ needs.discover-2.result }}
          BLOCK_3: ${{ needs.discover-3.result }}
          BLOCK_4: ${{ needs.discover-4.result }}
        run: |
          set -euo pipefail
          for result in "$BLOCK_1" "$BLOCK_2" "$BLOCK_3" "$BLOCK_4"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Discovery block did not complete: $result" >&2
              exit 1
            fi
          done
          jq -e '.complete' combined-results/logging-discovery.json > /dev/null || {
            echo "Missing account artifacts: discovery is incomplete" >&2
            exit 1
          }
